<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name=viewport content="width=device-width,initial-scale=1"><title>KOBA</title><style>body{background:#0a1551;color:#fff;font-family:sans-serif;padding:15px}input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none}.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;margin-top:10px}.g{background:#16a34a;color:#fff}.d{background:#1c2333;color:#fff}.card{background:#1c2333;padding:15px;border-radius:12px;margin-top:12px}</style></head><body><h1>🎓 SALAWE KOBA</h1><p>Wanakikundi: <b id="idadi">0</b> | Malipo: 255793398185 | WhatsApp: 255622016657</p><div class=card><h3>JISAJILI - Anza ZERO</h3><input id=jina placeholder="Jina"><input id=simu placeholder="Simu"><input id=nywila type=password placeholder=Nywila><button class="btn g" onclick=jisajili()>JISAJILI</button></div><div class=card><h3>ADMIN - admin / 1234</h3><input id=a1 value=admin><input id=a2 type=password value=1234><button class="btn g" onclick=admin()>INGIA ADMIN</button><div id=list></div><button class="btn g" style="background:#217346" onclick=pakua()>📥 PAKUA EXCEL</button></div><script>function upd(){let u=JSON.parse(localStorage.getItem('koba')||'[]');document.getElementById('idadi').innerText=u.length;let l=document.getElementById('list');l.innerHTML='';let tot=0;if(u.length==0)l.innerHTML='Hakuna - Imeanza ZERO';else u.forEach((x,i)=>{tot+=x.jumla;l.innerHTML+=`<div>${i+1}. ${x.jina} - ${x.simu} - TZS ${x.jumla}</div>`});if(u.length>0)l.innerHTML+=`<b>Jumla: TZS ${tot}</b>`}function jisajili(){let j=document.getElementById('jina').value,s=document.getElementById('simu').value,n=document.getElementById('nywila').value;if(!j||!s||!n){alert('Jaza');return}let u=JSON.parse(localStorage.getItem('koba')||'[]');u.push({jina:j,simu:s,nywila:n,jumla:1000});localStorage.setItem('koba',JSON.stringify(u));window.open(`https://wa.me/255622016657?text=MTU MPYA: ${j} - ${s} - Idadi: ${u.length}`,'_blank');upd();alert('Umefanikiwa! Idadi: '+u.length)}function admin(){let a1=document.getElementById('a1').value,a2=document.getElementById('a2').value;if(a1=='admin'&&a2=='1234'){upd();alert('Admin - Watu wote: '+JSON.parse(localStorage.getItem('koba')||'[]').length)}else alert('Sio sahihi')}function pakua(){let u=JSON.parse(localStorage.getItem('koba')||'[]');if(u.length==0){alert('Hakuna watu');return}let csv="Jina,Simu,Jumla\n";u.forEach(x=>{csv+=`"${x.jina}","${x.simu}",${x.jumla}\n`});let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='KOBA.csv';a.click()}upd();</script></body></html>
