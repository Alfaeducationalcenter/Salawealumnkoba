<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SALAWE ALUMNI KOBA</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;background:#0a1551;color:white;min-height:100vh}.header{padding:25px 20px}.header h1{font-size:26px;font-weight:900}.container{padding:12px}.card{background:#1e293b;padding:20px;border-radius:16px;margin-top:12px}.bold{font-weight:800}.muted{color:#94a3b8;font-size:13px}.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:10px}.btn-gold{background:#8a5a00;color:white}.btn-gray{background:#3f3f46;color:white}.btn-green{background:#16a34a;color:white}.hidden{display:none}input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:white}.tabs{display:flex;gap:6px;margin-bottom:10px}.tab{flex:1;padding:11px;text-align:center;background:#1e293b;border-radius:10px;cursor:pointer;font-size:12px}.tab.active{background:white;color:#0a1551;font-weight:bold}</style></head><body><div class="header"><h1>🎓 SALAWE ALUMNI KOBA</h1><p>Karibu Mfumo wa Wanachama - Mwenyekiti: Emmanuel M. Shinje</p></div><div class="container"><div id="auth-box"><div class="tabs"><div class="tab active" id="t1" onclick="tab('jisajili')">JISAJILI</div><div class="tab" id="t2" onclick="tab('ingia')">INGIA</div><div class="tab" id="t3" onclick="tab('admin')">ADMIN</div></div><div class="card" id="box-jisajili"><h3>Jisajili Mpya</h3><input id="r_jina" placeholder="Jina Kamili"><input id="r_simu" placeholder="Simu"><input id="r_nywila" type="password" placeholder="Weka Nywila"><input id="r_nywila2" type="password" placeholder="Rudia Nywila"><button class="btn btn-gold" onclick="jisajili()">JISAJILI</button></div><div class="card hidden" id="box-ingia"><h3>Ingia Mwanachama</h3><input id="l_jina" placeholder="Jina au Simu"><input id="l_nywila" type="password" placeholder="Nywila"><button class="btn btn-gold" onclick="ingia()">INGIA</button></div><div class="card hidden" id="box-admin"><h3>🔐 ADMIN LOGIN</h3><input id="a_jina" value="admin"><input id="a_nywila" type="password" value="1234"><button class="btn btn-green" onclick="adminIngia()">INGIA ADMIN</button><p class="muted">Username: admin | Password: 1234</p></div></div><div class="card hidden" id="dash"><h3>Habari, <span id="d_jina" class="bold"></span></h3><p class="muted">Jumla: TZS <span id="d_jumla" class="bold"></span></p><button class="btn btn-gold" onclick="changa()">+ Changa 1,000</button><button class="btn btn-gray" onclick="toka()">Toka</button></div><div class="card hidden" id="admin-dash"><h3>ADMIN - Orodha ya Waliojisajili</h3><p class="muted">Jumla: <span id="a_idadi" class="bold">0</span> | Fedha: TZS <span id="a_jumla" class="bold">0</span></p><div id="admin-table"></div><button class="btn btn-gray" onclick="toka()">Toka</button></div></div><script>const ADMIN_USER="admin";const ADMIN_PASS="1234";const ADMIN_PHONE="255756457470";function tab(t){document.getElementById('box-jisajili').classList.add('hidden');document.getElementById('box-ingia').classList.add('hidden');document.getElementById('box-admin').classList.add('hidden');document.getElementById('t1').classList.remove('active');document.getElementById('t2').classList.remove('active');document.getElementById('t3').classList.remove('active');if(t=='jisajili'){document.getElementById('box-jisajili').classList.remove('hidden');document.getElementById('t1').classList.add('active')}else if(t=='ingia'){document.getElementById('box-ingia').classList.remove('hidden');document.getElementById('t2').classList.add('active')}else{document.getElementById('box-admin').classList.remove('hidden');document.getElementById('t3').classList.add('active')}}function jisajili(){let j=document.getElementById('r_jina').value.trim();let s=document.getElementById('r_simu').value.trim();let n=document.getElementById('r_nywila').value;let n2=document.getElementById('r_nywila2').value;if(!j||!s||!n){alert('Jaza zote');return}if(n!=n2){alert('Nywila hazifanani');return}let users=JSON.parse(localStorage.getItem('koba_users')||'[]');if(users.find(u=>u.simu==s)){alert('Tayari');tab('ingia');return}let nu={jina:j,simu:s,nywila:n,jumla:1000,wiki:1};users.push(nu);localStorage.setItem('koba_users',JSON.stringify(users));localStorage.setItem('koba_current',JSON.stringify(nu));let msg=`*MTU MPYA*%0AJina:${j}%0ASimu:${s}`;window.open(`https://wa.me/${ADMIN_PHONE}?text=${msg}`,'_blank');showDash(nu);}function ingia(){let j=document.getElementById('l_jina').value.trim();let n=document.getElementById('l_nywila').value;let users=JSON.parse(localStorage.getItem('koba_users')||'[]');let u=users.find(x=>(x.jina.toLowerCase()==j.toLowerCase()||x.simu==j)&&x.nywila==n);if(!u){alert('Jina au Nywila si sahihi');return}localStorage.setItem('koba_current',JSON.stringify(u));showDash(u);}function adminIngia(){let j=document.getElementById('a_jina').value.trim();let n=document.getElementById('a_nywila').value;if(j!==ADMIN_USER||n!==ADMIN_PASS){alert('Admin si sahihi - tumia admin / 1234');return}document.getElementById('auth-box').classList.add('hidden');showAdmin();}function showDash(u){document.getElementById('auth-box').classList.add('hidden');document.getElementById('d_jina').innerText=u.jina;document.getElementById('d_jumla').innerText=u.jumla;document.getElementById('dash').classList.remove('hidden');}function showAdmin(){let users=JSON.parse(localStorage.getItem('koba_users')||'[]');let total=0;users.forEach(u=>total+=u.jumla);document.getElementById('a_idadi').innerText=users.length;document.getElementById('a_jumla').innerText=total;let tbody=document.getElementById('admin-table');tbody.innerHTML='';users.forEach((u,i)=>{tbody.innerHTML+=`<div style="background:#0f172a;padding:10px;margin:5px 0;border-radius:8px">${i+1}. ${u.jina} - ${u.simu} - TZS ${u.jumla}</div>`});document.getElementById('admin-dash').classList.remove('hidden');}function toka(){localStorage.removeItem('koba_current');location.reload();}function changa(){let cur=JSON.parse(localStorage.getItem('koba_current'));cur.jumla+=1000;cur.wiki+=1;let users=JSON.parse(localStorage.getItem('koba_users'));let idx=users.findIndex(u=>u.simu==cur.simu);users[idx]=cur;localStorage.setItem('koba_users',JSON.stringify(users));localStorage.setItem('koba_current',JSON.stringify(cur));let msg=`*MCHANGO*%0AJina:${cur.jina}%0AAmelipa:1000%0AJumla:${cur.jumla}`;window.open(`https://wa.me/${ADMIN_PHONE}?text=${msg}`,'_blank');showDash(cur);}let cur=localStorage.getItem('koba_current');if(cur){showDash(JSON.parse(cur))}</script></body></html>
