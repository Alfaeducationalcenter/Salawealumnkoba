<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SALAWE ALUMNI KOBA</title>
<style>
body{font-family:sans-serif;background:#0a2a5e;color:white;padding:20px}
.card{background:white;color:#0a2a5e;padding:20px;border-radius:15px;margin:10px 0}
input,button{width:100%;padding:15px;margin:5px 0;border-radius:10px;border:none}
button{background:#d4af37;color:#0a2a5e;font-weight:bold}
.hidden{display:none}
</style>
</head>
<body>
<h2>🎓 SALAWE ALUMNI KOBA</h2>
<p>Wanakikundi 40 | Mchango 1,000/Wiki</p>

<div id="login" class="card">
<h3>Ingia kwa Nywila Yako</h3>
<input id="jina" placeholder="Jina lako (mfano: Juma)">
<input id="pin" type="password" placeholder="Nywila yako (PIN 4)">
<button onclick="ingia()">INGIA</button>
<p><small>Kila mtu anaona yake tu. PIN ya kwanza ni 1234</small></p>
</div>

<div id="dash" class="card hidden">
<h3 id="sal"></h3>
<p>Jumla Uliyochanga: <b id="jumla"></b></p>
<p>Wiki Uliyolipa: <b id="wiki"></b>/52</p>
<button onclick="changa()">+ Changa TZS 1,000 Leo</button>
<button onclick="toka()" style="background:#ccc">Toka</button>
</div>

<script>
let data = JSON.parse(localStorage.getItem('koba40')||'{}');
function ingia(){
 let j=jina.value.trim(); let p=pin.value;
 if(!j)return alert('Weka jina');
 if(!data[j]) data[j]={pin:p||'1234', jumla:0, wiki:0};
 if(data[j].pin!=p && p!='1234') return alert('PIN sio sahihi!');
 localStorage.setItem('koba40',JSON.stringify(data));
 localStorage.setItem('user',j);
 onyesha();
}
function onyesha(){
 let j=localStorage.getItem('user');
 let u=data[j];
 login.classList.add('hidden'); dash.classList.remove('hidden');
 sal.textContent='Habari, '+j+' - Salio: TZS '+u.jumla.toLocaleString();
 jumla.textContent='TZS '+u.jumla; wiki.textContent=u.wiki;
}
function changa(){
 let j=localStorage.getItem('user');
 data[j].jumla+=1000; data[j].wiki+=1;
 localStorage.setItem('koba40',JSON.stringify(data));
 onyesha(); alert('Hongera! Umechanga 1,000');
}
function toka(){localStorage.removeItem('user'); location.reload()}
if(localStorage.getItem('user')){data=JSON.parse(localStorage.getItem('koba40')); onyesha()}
</script>
</body>
</html>
